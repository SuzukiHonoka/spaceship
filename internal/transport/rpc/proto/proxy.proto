syntax = "proto3";

package proxy;

option go_package = "github.com/SuzukiHonoka/spaceship/v2/internal/transport/rpc/proto;proxy";

service Proxy{
  rpc DnsResolve(DnsRequest) returns (DnsResponse) {};
  // DnsExchange carries one complete DNS wire query to the Spaceship server
  // and returns the complete wire response produced by its configured
  // resolver. It is intentionally separate from DnsResolve so existing
  // clients remain wire compatible while TUN DNS hijacking can preserve EDNS,
  // DNSSEC, authority/additional sections, flags, and truncation.
  rpc DnsExchange(DnsExchangeRequest) returns (DnsExchangeResponse) {};
  rpc Proxy(stream ProxySRC) returns (stream ProxyDST) {};
}

// Network selects the transport for the proxied connection.
// TCP is the zero value so that an unset field (and pre-2.1.5 clients that omit
// it) defaults to TCP, matching historical behavior.
enum Network{
  TCP = 0;
  UDP = 1;
}

message ProxySRC{
  oneof header_or_payload{
    ProxyHeader header = 1;
    bytes payload = 2;
  }

  message ProxyHeader{
    // target address, host:port
    string addr = 1;
    // transport network for the connection (defaults to TCP)
    Network network = 2;
  }
}

enum ProxyStatus{
  Session = 0;
  Error = 1;
  Accepted = 2;
  EOF = 3;
}

message ProxyDST{
  ProxyStatus status = 1;

  oneof header_or_payload{
    ProxyHeader header = 2;
    bytes payload = 3;
  }

  message ProxyHeader{
    string addr = 1;
  }
}

message DnsRequestItem{
  string fqdn = 1;
  uint32 qType = 2;
  bool blockIpv6 = 3;
}

// Complete DNS Resource Record
message RR_Record {
  // Wire format of the complete DNS RR (recommended approach)
  bytes wire_data = 1;
  // Metadata for easier processing (optional)
  string name = 2;
  uint32 rrtype = 3;
  uint32 class = 4;
  uint32 ttl = 5;
}

message DnsRequest{
  // user id
  string id = 1;
  // dns query items
  repeated DnsRequestItem items = 2;
}

message DnsResult {
  // fqdn
  string fqdn = 1;
  // resolved DNS records (updated to use complete RR format)
  repeated RR_Record records = 2;
  // DNS response code returned by the upstream resolver.
  uint32 rcode = 3;
}

message DnsResponse{
  // fqdn resolved result
  repeated DnsResult result = 1;
}

message DnsExchangeRequest {
  // A complete DNS query in RFC 1035 wire format. DNS-over-TCP's two-byte
  // length prefix is transport framing and is not included here.
  bytes wire_query = 1;
  // The transport on which the intercepted query arrived. The server uses the
  // same transport for its upstream exchange so UDP truncation and TCP
  // semantics remain visible to the original client.
  Network network = 2;
  bool block_ipv6 = 3;
}

message DnsExchangeResponse {
  // A complete DNS response in RFC 1035 wire format, without TCP framing.
  bytes wire_response = 1;
}
