kind: pipeline
type: docker
name: golang-ci

steps:
  - name: lint
    image: golangci/golangci-lint:v2.13.2-alpine
    commands:
      - golangci-lint run --timeout=5m ./...

  - name: format-check
    image: golang:1.27.0-alpine
    commands:
      - apk add --no-cache bash
      - gofmt -l . | tee /dev/stderr
      - test -z "$(gofmt -l .)" # Fail if any files are not formatted

  - name: dependency-check
    image: golang:1.27.0-alpine
    commands:
      - apk add --no-cache git
      - go mod tidy
      - git diff --exit-code # Ensure no changes were made
      - go mod verify

  - name: security-scan
    image: ghcr.io/securego/gosec:2.29.0
    commands:
      # scripts/e2e is a developer harness, not shipped code: build.sh only
      # builds cmd/spaceship. It exists to spawn binaries with generated paths
      # and self-signed certs, so gosec's subprocess, path-traversal, and file
      # inclusion rules fire on its whole reason for existing. Scanning it
      # would mean ~34 permanent suppressions that hide real findings.
      - gosec -exclude-generated -exclude-dir=scripts ./...

  - name: test-with-coverage
    image: golang:1.27.0-alpine
    environment:
      GO111MODULE: on
      GOCACHE: /go/cache
      GOPATH: /go
      CGO_ENABLED: 1
    commands:
      - apk add --no-cache gcc musl-dev
      - go vet ./...
      - |
        # scripts/e2e is a developer harness and is not part of the shipped binary.
        PACKAGES="$(go list ./... | grep -v '/scripts/e2e$')"
        go test -race -coverprofile=coverage.out -covermode=atomic $PACKAGES
      - go tool cover -func=coverage.out
      - |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        # Ratchet this floor upward as repository-wide coverage grows.
        THRESHOLD=68.0
        echo "Code coverage is $COVERAGE%, threshold is $THRESHOLD%"
        awk -v coverage="$COVERAGE" -v threshold="$THRESHOLD" \
          'BEGIN { if (coverage < threshold) exit 1 }'

  # Drone only permits privileged steps for trusted repositories. This job
  # creates a disposable network namespace and never modifies the host rules.
  - name: netfilter-redirect-integration
    image: golang:1.27.0-alpine
    privileged: true
    environment:
      CGO_ENABLED: "1"
      SPACESHIP_REDIRECT_INTEGRATION: "1"
      SPACESHIP_REDIRECT_INTEGRATION_IPV6: "1"
    commands:
      - apk add --no-cache gcc musl-dev iproute2 iptables util-linux
      - go test -count=1 -race -run '^TestNetfilterRedirectIntegration$' ./internal/redirect
    depends_on:
      - test-with-coverage
    # Never execute pull-request code with host-equivalent container privileges.
    when:
      event:
        - push
        - tag

  - name: coverage-report
    image: robertstettner/drone-codecov
    settings:
      token:
        from_secret: codecov_token
      files:
        - coverage.out
    depends_on:
      - test-with-coverage
    when:
      branch:
        - main
        - master
      event:
        - push
        - pull_request

volumes:
  - name: go-cache
    temp: { }

trigger:
  event:
    - push
    - pull_request
    - tag
